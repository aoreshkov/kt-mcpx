name: Release

# A tag vX.Y.Z tests, signs, attests and uploads every published module to the Maven Central Portal,
# then drafts the GitHub release. RELEASING.md has the one-time setup and the manual steps after.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      # No cache on the release path: a release is built from the tag alone, never from state a cache
      # could carry in.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Build, test and check the public API
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the signing key and the Portal token; give it a required reviewer so a release waits for
    # approval.
    environment: release
    permissions:
      contents: write # draft the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      STAGING: build/staging-repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Everything that can fail without building fails here, before anything is uploaded: a deployment
      # left half done in the Portal, or a release once published, can't simply be undone.
      - name: Check the tag matches the version, and extract the release notes
        run: |
          version=$(awk -F= '$1 == "version" { print $2 }' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version=$version in gradle.properties"
            exit 1
          fi
          case "$version" in *-SNAPSHOT) echo "::error::Snapshots aren't released"; exit 1;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The notes are the version's section of the changelog, without its heading or the link
          # references after it.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Build the signed bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew stage --console=plain
          # Every file the Portal gets must be signed; an unsigned bundle means the key wasn't configured.
          unsigned=$(find "$STAGING" \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \) \
            -exec sh -c '[ -f "$1.asc" ] || echo "$1"' _ {} \;)
          if [ -n "$unsigned" ]; then
            echo "::error::Unsigned files: $unsigned"
            exit 1
          fi
          # Only the four published modules, each at the released version.
          unexpected=$(find "$STAGING" -mindepth 5 -maxdepth 5 -type d \
            | grep -vE "/app/oreshkov/ktmcpx/kt-mcpx-(core|ktor|stdio|testing)/$VERSION$" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected directories in the bundle: $unexpected"
            exit 1
          fi
          (cd "$STAGING" && zip -qr "$GITHUB_WORKSPACE/build/kt-mcpx-bundle.zip" .)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.STAGING }}/**/*.jar
            ${{ env.STAGING }}/**/*.pom
            ${{ env.STAGING }}/**/*.module

      # USER_MANAGED: the Portal validates the deployment and waits for it to be published by hand. The
      # upload returns as soon as the bundle lands and validation runs after it, so this step waits for
      # the verdict: a deployment the Portal rejects gets no draft release.
      - name: Upload to the Central Portal and wait for its validation
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          id=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form bundle=@build/kt-mcpx-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED&name=kt-mcpx-$VERSION")
          if ! [[ $id =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::The Portal answered the upload with no deployment id: $id"
            exit 1
          fi
          # The id is what dropping the deployment needs, if it never gets published.
          echo "Central Portal deployment: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
          # Up to 20 minutes, every 20 seconds; a status request that fails transiently is retried.
          for _ in $(seq 60); do
            status=$(curl --fail-with-body --silent --show-error --retry 3 --request POST \
              --header "Authorization: Bearer $CENTRAL_TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")
            state=$(jq -r .deploymentState <<< "$status")
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "Deployment $id: $state"
                exit 0;;
              FAILED)
                echo "::error::The Central Portal rejected deployment $id"
                jq .errors <<< "$status"
                exit 1;;
            esac
            sleep 20
          done
          echo "::error::Deployment $id was still $state after 20 minutes"
          exit 1

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a hyphen, such as 0.1.0-rc.1, is a pre-release, so it never becomes the latest.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease);; esac
          mapfile -t assets < <(find "$STAGING" -name '*.jar' | sort)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "kt-mcpx $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${assets[@]}"
